<script>
/* Layout (launcher.html sits NEXT TO the htmls folder):
   launcher.html
   htmls/
     My Game/
       info.txt        name: / tags: / open: / entry: / description:
       icon.png        banner.jpg
       game/index.html
   Right-click a game for Properties. "+ Add a game" creates all of the above for you. */
const $=s=>document.querySelector(s);
const IMG=/\.(png|jpe?g|gif|webp)$/i;
let games=[],selected=null,query="",root=null,rootName="htmls";

/* ---- remember the chosen folder ---- */
const db=()=>new Promise((res,rej)=>{const r=indexedDB.open("htmlgames",1);r.onupgradeneeded=()=>r.result.createObjectStore("k");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function kv(mode,val,key="root"){try{const d=await db();return await new Promise(res=>{const t=d.transaction("k","readwrite").objectStore("k");const q=mode==="set"?t.put(val,key):t.get(key);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})}catch(e){return null}}
async function pick(){
  if(!window.showDirectoryPicker){status("Your browser needs the File System Access API (use Chrome or Edge).");return}
  try{const h=await showDirectoryPicker({mode:"readwrite"});let rt=h;
    try{rt=await h.getDirectoryHandle("htmls");await kv("set",h,"base");await setBase(h)}catch(e){rt=h}
    await kv("set",rt);await load(rt)}catch(e){}
}
async function restore(){
  initBase();const h=await kv("get");if(!h)return render();
  if(await h.queryPermission({mode:"readwrite"})==="granted")return load(h);
  status("Click to re-allow access to your htmls folder");
  $("#content").innerHTML=`<div class="empty"><h2>Welcome back</h2><p>Allow access to <b>${esc(h.name)}</b> to load your library.</p><button class="play" id="allow">Load library</button></div>`;
  $("#allow").onclick=async()=>{if(await h.requestPermission({mode:"readwrite"})==="granted"){await initBase(true);load(h)}};
}

/* ---- info.txt ---- */
function parseInfo(txt,fallback){
  const o={name:"",description:"",tags:[],open:"launcher",entry:"",url:"",ribbon:""};let cur=null,tags="";const loose=[];
  for(const line of txt.replace(/\r/g,"").split("\n")){
    const m=line.match(/^\s*(name|title|description|desc|tags?|open|entry|url|link|ribbon|developer|short|released)\s*[:=]\s*(.*)$/i);
    if(m){let k=m[1].toLowerCase();k=k==="title"?"name":k==="desc"?"description":k==="tag"?"tags":k==="link"?"url":k;cur=k;if(k==="tags")tags=m[2];else o[k]=m[2]}
    else if(cur==="description")o.description+="\n"+line;
    else if(!cur&&line.trim())loose.push(line.trim());
  }
  if(!o.name&&loose.length){o.name=loose[0];o.description=o.description||loose[1]||"";tags=tags||loose[2]||""}
  o.tags=tags.split(/[,;#]+/).map(t=>t.trim()).filter(Boolean);
  o.name=(o.name||fallback).trim();o.description=o.description.trim();o.entry=o.entry.trim();o.url=o.url.trim();o.ribbon=!/^(off|false|no|hide|0)/i.test(o.ribbon.trim());if(o.url&&!o.tags.some(t=>t.toLowerCase()==='website'))o.tags.push('Website');
  o.open=/tab/i.test(o.open)?"tab":/ask/i.test(o.open)?"ask":"launcher";return o;
}
const infoText=o=>`name: ${o.name.replace(/\s+/g," ")}\ntags: ${o.tags.join(", ")}\nopen: ${o.open}\nentry: ${o.entry}\n${o.url?'url: '+o.url+'\nribbon: '+(o.ribbon===false?'off':'on')+'\n':''}description: ${o.description}\n`;

/* ---- file helpers ---- */
const put=async(d,n,data)=>{const w=await(await d.getFileHandle(n,{create:true})).createWritable();await w.write(data);await w.close()};
async function copyDir(a,b){for await(const [n,h] of a.entries()){if(h.kind==="file")await put(b,n,await h.getFile());else await copyDir(h,await b.getDirectoryHandle(n,{create:true}))}}
async function walk(d,pre,depth,out){for await(const [n,h] of d.entries()){if(h.kind==="file"&&/\.html?$/i.test(n))out.push([...pre,n]);else if(h.kind==="directory"&&depth<4)await walk(h,[...pre,n],depth+1,out)}}
async function hasPath(d,p){try{const s=p.split("/");for(const x of s.slice(0,-1))d=await d.getDirectoryHandle(x);await d.getFileHandle(s.at(-1));return true}catch(e){return false}}
async function toIndex(gd,parts){ /* renames the chosen html to index.html in place, returns its path */
  let d=gd;for(const p of parts.slice(0,-1))d=await d.getDirectoryHandle(p);
  const last=parts.at(-1);
  if(last.toLowerCase()!=="index.html"){await put(d,"index.html",await(await d.getFileHandle(last)).getFile());await d.removeEntry(last);return[...parts.slice(0,-1),"index.html"].join("/")}
  return parts.join("/");
}
async function setImg(dir,base,file){
  if(!file)return;const old=[];
  for await(const [n] of dir.entries())if(n.toLowerCase().startsWith(base+".")&&IMG.test(n))old.push(n);
  for(const n of old)await dir.removeEntry(n);
  const ext=(file.name.match(/\.(png|jpe?g|gif|webp)$/i)||[,"png"])[1].toLowerCase();
  await put(dir,base+"."+ext,file);
}

/* ---- scanning ---- */
async function load(r,sel){
  root=r;rootName=r.name;status("Scanning "+r.name+"...");
  games.forEach(g=>{g.icon&&URL.revokeObjectURL(g.icon);g.banner&&URL.revokeObjectURL(g.banner)});games=[];
  for await(const [fname,h] of r.entries()){
    if(h.kind!=="directory")continue;
    try{
      let icon,banner,txt,rootIdx=false;const subs=[];
      for await(const [n,c] of h.entries()){
        if(c.kind==="file"){
          if(/\.txt$/i.test(n)&&(!txt||/^(info|about|details)\./i.test(n)))txt=c;
          if(/^icon\./i.test(n)&&IMG.test(n))icon=c;
          if(/^banner\./i.test(n)&&IMG.test(n))banner=c;
          if(n.toLowerCase()==="index.html")rootIdx=true;
        }else subs.push([n,c]);
      }
      const info=parseInfo(txt?await(await txt.getFile()).text():"",fname);
      let entry=info.entry&&await hasPath(h,info.entry)?info.entry:null;
      if(!entry){let gd=null;
        for(const [n,c] of subs){try{await c.getFileHandle("index.html");if(gd===null||/^(game|html|web)$/i.test(n))gd=n}catch(e){}}
        entry=gd!==null?gd+"/index.html":rootIdx?"index.html":null}
      if(!entry&&!info.url)continue;
      games.push({...info,folder:fname,dir:h,txtName:txt?txt.name:"info.txt",entry:entry||"",
        icon:icon?URL.createObjectURL(await icon.getFile()):null,
        banner:banner?URL.createObjectURL(await banner.getFile()):null});
    }catch(e){console.warn(fname,e)}
  }
  instPhAttach();games.sort((a,b)=>a.name.localeCompare(b.name,undefined,{sensitivity:"base"}));
  await loadLib();checkNet();themeFromLib();selected=games.find(g=>g.folder===sel)||null;
  status(games.length+" game(s) loaded from "+r.name);setTimeout(()=>{if(!window.__placeDone){window.__placeDone=1;placeCheck()}},400);render();if(view==="settings")renderSettings();if(view==="help")renderHelp();upd.ready=true;renderBell();maybeAutoCheck();
}

async function remove(g){
  if(!g||g.ph)return;
  if(!confirm(`Delete "${g.name}" and ALL of its files from the htmls folder? This can't be undone.`))return;
  try{
    if(await root.requestPermission({mode:"readwrite"})!=="granted")throw new Error("Write access to the htmls folder was denied.");
    status(`Deleting "${g.name}"...`);
    let err=null;
    for(let t=0;t<3;t++){
      try{await root.removeEntry(g.folder,{recursive:true});err=null;break}
      catch(e){if(e&&e.name==="NotFoundError"){err=null;break}err=e;await new Promise(r=>setTimeout(r,500))}}
    if(err)throw err;
    let still=true;try{await root.getDirectoryHandle(g.folder)}catch(e){still=false}
    if(still)throw new Error("The folder is still there. A file in it may be open in another program or tab.");
    lib.favs=(lib.favs||[]).filter(f=>f!==g.folder);
    (lib.groups||[]).forEach(x=>{x.games=x.games.filter(f=>f!==g.folder)});
    delete lib.count[g.folder];if(lib.played)delete lib.played[g.folder];
    const bk=profBase(g.folder).replace(/\s*\(\d+\)\s*$/,"").toLowerCase();
    for(const k of Object.keys(lib.remote||{})){const r=lib.remote[k];if(k===bk||k===g.name.trim().toLowerCase()||(r&&r.folder===g.folder))delete lib.remote[k]}
    if(selected===g)selected=null;
    await saveLib();await load(root);
    status(`Deleted "${g.name}" and its folder.`)
  }catch(e){const m="Couldn't delete "+g.name+": "+(e&&e.message?e.message:e);status(m);alert(m)}
}

/* ---- reading an uploaded game profile: a folder or a .zip ---- */
async function listFiles(d,pre,out,depth){for await(const [n,h] of d.entries()){if(h.kind==="file")out.push({path:pre+n,get:()=>h.getFile()});else if(depth<12)await listFiles(h,pre+n+"/",out,depth+1)}}
async function readZip(file){
  const buf=await file.arrayBuffer(),dv=new DataView(buf),u8=new Uint8Array(buf),td=new TextDecoder();let e=-1;
  for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-65557);i--)if(dv.getUint32(i,true)===0x06054b50){e=i;break}
  if(e<0)throw new Error("That doesn't look like a valid .zip file.");
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const out=[];
  for(let k=0;k<n;k++){
    if(dv.getUint32(p,true)!==0x02014b50)throw new Error("The .zip file looks damaged.");
    const fl=dv.getUint16(p+8,true),me=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),us=dv.getUint32(p+24,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
    const name=td.decode(u8.subarray(p+46,p+46+nl)).replace(/\\/g,"/");p+=46+nl+xl+cl;
    if(name.endsWith("/"))continue;
    if(cs===0xFFFFFFFF||us===0xFFFFFFFF||lo===0xFFFFFFFF)throw new Error("Zip64 files aren't supported. Zip the folder again with a normal zip tool.");
    if(fl&1)throw new Error("Password-protected zips aren't supported.");
    out.push({path:name,get:async()=>{const ln=dv.getUint16(lo+26,true),lx=dv.getUint16(lo+28,true),st0=lo+30+ln+lx,data=u8.subarray(st0,st0+cs);
      if(me===0)return new Blob([data]);
      if(me===8)return await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).blob();
      throw new Error("This zip uses a compression method Volt can't read (method "+me+").")}})}
  return out}
function detectProfile(list,fallback){
  const clean=list.map(f=>({...f,path:f.path.replace(/^(\.\/|\/)+/,"")})).filter(f=>f.path&&!f.path.split("/").includes("..")&&!/(^|\/)(__MACOSX|\.DS_Store|Thumbs\.db)(\/|$)/.test(f.path));
  const infos=clean.filter(f=>/(^|\/)info\.txt$/i.test(f.path));let prefix="";
  if(infos.length){const dp=x=>x.path.split("/").length,mn=Math.min(...infos.map(dp)),tp=infos.filter(f=>dp(f)===mn);
    if(tp.length>1)throw new Error(`That contains ${tp.length} game profiles. Upload one profile folder (or zip) at a time.`);
    prefix=tp[0].path.slice(0,-8)}
  else{const tops=new Set(clean.map(f=>f.path.split("/")[0]));if(tops.size===1&&clean.every(f=>f.path.includes("/")))prefix=[...tops][0]+"/"}
  const files=clean.filter(f=>f.path.startsWith(prefix)).map(f=>({path:f.path.slice(prefix.length),get:f.get}));
  return{files,folderName:prefix?prefix.replace(/\/$/,"").split("/").pop():fallback,info:files.find(f=>f.path.toLowerCase()==="info.txt")}}

/* a folder counts as a game profile when it (or a folder inside it) has an info.txt with profile keys */
async function isProfileDir(d){
  const chk=async dir=>{for await(const [n,h] of dir.entries())if(h.kind==="file"&&n.toLowerCase()==="info.txt"){try{return /^\s*(name|title|entry|tags?|description)\s*[:=]/im.test(await(await h.getFile()).text())}catch(e){return false}}return false};
  if(await chk(d))return true;
  for await(const [n,h] of d.entries())if(h.kind==="directory"&&await chk(h))return true;
  return false}

/* auto-group: games sharing the most tags end up together */
function autoGroup(inc,min){
  const inG=new Set(lib.groups.flatMap(x=>x.games)),disp={};let pool=games.filter(g=>inc||!inG.has(g.folder));
  const T=new Map(games.map(g=>[g,[...new Set(g.tags.map(t=>{const k=t.toLowerCase();disp[k]=disp[k]||t;return k}))]])),out=[];
  for(;;){
    const cnt={};pool.forEach(g=>T.get(g).forEach(t=>cnt[t]=(cnt[t]||0)+1));
    let best=null,bs=-1;
    for(const t of Object.keys(cnt).sort()){if(cnt[t]<min)continue;
      const m=pool.filter(g=>T.get(g).includes(t)),c2={};
      m.forEach(g=>T.get(g).forEach(u=>{if(u!==t)c2[u]=(c2[u]||0)+1}));
      const sc=m.length*1000+Object.values(c2).filter(v=>v>1).reduce((a,v)=>a+v,0);
      if(sc>bs){bs=sc;best={t,m,c2}}}
    if(!best)break;
    /* if the games share the main tag but split by a second tag (Website+TV vs Website+games), make one group per second tag */
    const parts=[];let rest=[...best.m];
    for(;;){const c={};rest.forEach(g=>T.get(g).forEach(u=>{if(u!==best.t)c[u]=(c[u]||0)+1}));
      const cand=Object.entries(c).filter(([u,n])=>n>=min&&(parts.length?true:n<rest.length)).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]))[0];
      if(!cand)break;const sub=rest.filter(g=>T.get(g).includes(cand[0]));parts.push({name:disp[best.t]+" & "+disp[cand[0]],games:sub});rest=rest.filter(g=>!sub.includes(g))}
    if(parts.length&&rest.length>=min)parts.push({name:disp[best.t],games:rest});
    if(parts.length>=2)parts.forEach(x=>out.push({name:x.name,games:x.games.map(g=>g.folder)}));
    else{const sd=Object.entries(best.c2).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]))[0];
      out.push({name:disp[best.t]+(sd&&sd[1]>=Math.max(2,Math.ceil(best.m.length/2))?" & "+disp[sd[0]]:""),games:best.m.map(g=>g.folder)})}
    pool=pool.filter(g=>!best.m.includes(g));
  }
  return out;
}

/* Blender-style colour ramp: click bar = add stop, drag stop = move, pick colour, rotate */
function rampEditor(el,r,onChange){
  let sel=0;
  el.innerHTML=`<div class="rmp"><div class="rbar"></div>
    <div class="rctl"><input type="color" class="rc"><label>Position <input type="number" class="rp fld" min="0" max="100" step="1" style="width:66px"> %</label><button class="btn rdel" type="button">Delete stop</button><button class="btn rflip" type="button">Flip</button></div>
    <div class="rctl"><span>Rotation</span><input type="range" class="ra" min="0" max="360" style="flex:1"><span class="rav" style="width:44px;text-align:right"></span></div>
    <div class="rhint">Click the bar to add a color stop. Drag a stop to move it.</div></div>`;
  const q=x=>el.querySelector(x),bar=q(".rbar");
  const draw=()=>{
    r.stops.forEach(s=>s.p=Math.round(Math.min(100,Math.max(0,s.p))*10)/10);sel=Math.min(sel,r.stops.length-1);
    bar.style.background=rampCss(r,90);bar.querySelectorAll(".rs").forEach(x=>x.remove());
    r.stops.forEach((s,i)=>{const m=document.createElement("i");m.className="rs"+(i===sel?" on":"");m.style.left=s.p+"%";m.dataset.s=i;m.innerHTML=`<b style="background:${s.c}"></b>`;bar.appendChild(m)});
    const s=r.stops[sel];q(".rc").value=s.c;q(".rp").value=s.p;q(".ra").value=r.angle;q(".rav").textContent=r.angle+"\u00b0";q(".rdel").disabled=r.stops.length<=2;
  };
  bar.oncontextmenu=e=>{e.preventDefault();e.stopPropagation()};
  bar.onpointerdown=e=>{
    e.preventDefault();const rc=bar.getBoundingClientRect(),pos=x=>Math.round(Math.min(100,Math.max(0,(x-rc.left)/rc.width*100))*10)/10;
    const mk=e.target.closest(".rs");
    if(!mk){const p=pos(e.clientX);r.stops.push({p,c:sample(r,p/100)});sel=r.stops.length-1;draw();onChange();return}
    sel=+mk.dataset.s;draw();
    const cur=bar.querySelector(`.rs[data-s="${sel}"]`);cur.setPointerCapture(e.pointerId);
    cur.onpointermove=ev=>{const s=r.stops[sel];s.p=pos(ev.clientX);cur.style.left=s.p+"%";bar.style.background=rampCss(r,90);q(".rp").value=s.p;onChange()};
    cur.onpointerup=()=>draw();
  };
  q(".rc").oninput=e=>{r.stops[sel].c=e.target.value;bar.style.background=rampCss(r,90);bar.querySelector(".rs.on b").style.background=e.target.value;onChange()};
  q(".rp").onchange=e=>{r.stops[sel].p=+e.target.value||0;draw();onChange()};
  q(".rdel").onclick=()=>{if(r.stops.length>2){r.stops.splice(sel,1);sel=Math.max(0,sel-1);draw();onChange()}};
  q(".rflip").onclick=()=>{r.stops.forEach(s=>s.p=100-s.p);draw();onChange()};
  q(".ra").oninput=e=>{r.angle=+e.target.value;q(".rav").textContent=r.angle+"\u00b0";onChange()};
  draw();
}

    <div class="sfr"><h3>${sIco(it)}${esc(it.name)}</h3>${sh.length?`<div class="sfs">${sh.map(u=>`<i style="background-image:url('${u}')"></i>`).join("")}</div>`:(it.m?`<p class="sfd">${esc(sShort(it))}</p>`:sFailed(it)?`<div class="sfailtx" style="padding:10px 14px"><b style="font-size:36px">&#10005;</b><div>Description and tags didn't load</div></div>`:`<div class="sloadtx"><i></i> Loading details...</div>`)}
    ${sTags(it).length?`<div><div class="sfl2">Popular tags</div>${sChips(sTags(it),5)}</div>`:""}
    <div class="sfoot"><span class="sprice">Free</span>${sBtn(it)}</div></div></div>
    ${f.length>1?`<div class="sdots">${f.map((_,i)=>`<i data-sa="dot" data-i="${i}" class="${i===store.slide%f.length?"on":""}"></i>`).join("")}</div>`:""}`}
const sCard=it=>`<div class="scard" data-sa="open" data-k="${esc(it.key)}"><div class="scimg" style="${sBg(it)}">${sPh(it)}</div><div class="scb">${sIco(it)}<b>${esc(it.name)}</b><span class="sprice">Free</span></div></div>`;
const sRow=it=>{const st=sState(it),d=sDay(sDate(it));
  return `<div class="srow" data-sa="open" data-k="${esc(it.key)}"><div class="srimg" style="${sBg(it)}">${sPh(it)}</div><div class="srt"><b>${sIco(it)}${esc(it.name)}</b><small>${it.m?esc(sTags(it).slice(0,5).join(", "))||"&nbsp;":sFailed(it)?"<span style='color:#e66'>&#10005; Details didn't load</span>":"Loading details..."}</small><small class="${st.k==="own"?"sown":""}">${st.k==="own"?"In your Library":st.k==="upd"?"Update available":""}</small></div><div class="srd">${esc(d)}</div><div class="srp"><span class="sprice">Free</span></div></div>`};
function sDetail(it){const m=it.m||{},st=sState(it),shots=(m.screens||[]).map(sImg).filter(Boolean),main=shots[store.shot]||sImg(m.banner),web=sTags(it).some(t=>t.toLowerCase()==="website");
  const rows=[["Developer",m.developer],["Released",m.released?sDay(new Date(m.released)):""],["Updated",sDay(sDate(it))],["Version",it.ver],["Type",web?"Website":"HTML game"],["Size",fmtSize(it.size)]].filter(r=>r[1]);
  return `${!it.m&&store.diag&&store.diag[it.key]!==undefined?`<div class="smsg bad">Couldn't read this game's details from its zip (${esc(store.diag[it.key])}).</div>`:""}<div class="scrumb"><a data-sa="back">All Games</a> &gt; <span>${esc(it.name)}</span></div><h1 class="stt">${sIco(it)}${esc(it.name)}</h1>
  <div class="sdet"><div class="sdl"><div class="smain" style="${main?`background-image:url('${main}')`:sBg(it)}">${sPh(it)}</div>${shots.length>1?`<div class="sthumbs">${shots.map((u,i)=>`<i data-sa="shot" data-i="${i}" class="${i===store.shot?"on":""}" style="background-image:url('${u}')"></i>`).join("")}</div>`:""}</div>
  <div class="sdr"><div class="scap" style="${sBg(it)}">${sPh(it)}</div>${it.m?`<p class="sdesc">${esc(sShort(it))}</p>`:""}<table class="sinfo">${rows.map(r=>`<tr><td>${r[0]}</td><td>${esc(r[1])}</td></tr>`).join("")}</table>${sTags(it).length?`<div class="sfl2" style="margin-top:12px">Popular tags</div>${sChips(sTags(it),12)}`:sTagPh(it)}</div></div>
  <div class="sbuy"><h2>${st.k==="own"?"Play":"Get"} ${esc(it.name)}</h2><div class="sbr">${st.k==="own"?`<span class="sown">In your Library</span>`:""}<span class="sprice">Free</span>${sBtn(it,1)}</div></div>
  <div class="sabout"><h2>About this game</h2><div class="sbody">${it.m?esc(m.description||sShort(it)):sTxtPh(it)}</div></div>`}

function renderStore(){
  if(view!=="store")return;
  const S=$("#store"),old=S.querySelector("#sq"),foc=old&&document.activeElement===old,pos=foc?old.selectionStart:0,top=S.scrollTop,c=updCfg(),its=store.items;
  const q=store.q.trim().toLowerCase(),filt=!!(q||store.tag),sel=store.sel&&its.find(i=>i.key===store.sel);
  let h=`<div class="sth"><div class="stw stbar"><div class="snav"><a data-sa="home" class="${!sel&&!filt?"on":""}">Your Store</a><a data-sa="goto" data-t="snew">New &amp; Updated</a><a data-sa="goto" data-t="stags">Browse by tag</a><a data-sa="refresh" title="Reload the store">${store.busy?"Loading...":"Refresh"}</a></div><div class="ssearch"><input id="sq" placeholder="search the store" value="${esc(store.q)}"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="#9fc2d9" stroke-width="1.6"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg></div></div></div><div class="stw stbody">`;
  if(store.msg)h+=store.msg==="__ok"?`<div class="smsg ok">Installed. It's in your Library now.</div>`:`<div class="smsg bad">${esc(store.msg)}</div>`;
  if(!c)h+=`<div class="empty"><h2>No store connected</h2><p>The store lists game profiles from the Google Drive folder set in this launcher's update source. None is set up yet.</p><button class="btn" data-sa="settings">Open Settings</button></div>`;
  else if(store.busy&&!its.length)h+=`<div class="empty"><h2>Loading the store...</h2><p>Reading the game list from Google Drive.</p></div>`;
  else if(store.error&&!its.length)h+=`<div class="empty"><h2>Couldn't load the store</h2><p style="color:#e66">${esc(store.error)}</p><button class="btn" data-sa="refresh">Try again</button></div>`;
  else if(!its.length)h+=`<div class="empty"><h2>Nothing published yet</h2><p>No game profiles are in the Drive folder. Publish one with Volt Publisher and it shows up here.</p></div>`;
  else if(sel)h+=sDetail(sel);
  else if(filt){
    const r=its.filter(i=>(!store.tag||sTags(i).some(t=>t.toLowerCase()===store.tag.toLowerCase()))&&(!q||(i.name+" "+sShort(i)+" "+((i.m&&i.m.description)||"")+" "+sTags(i).join(" ")).toLowerCase().includes(q)));
    h+=`<div class="shd">Search results <small>${r.length} game${r.length===1?"":"s"}${store.tag?` tagged <b>${esc(store.tag)}</b>`:""}</small> <span class="schip on" data-sa="clear">Clear &#10005;</span></div>`+(r.map(sRow).join("")||`<p style="color:var(--dim)">Nothing matches.</p>`)}
  else{
    const cnt=new Map();its.forEach(i=>sTags(i).forEach(t=>{const k=t.toLowerCase(),o=cnt.get(k)||{t,n:0};o.n++;cnt.set(k,o)}));
    const tg=[...cnt.values()].sort((a,b)=>b.n-a.n||a.t.localeCompare(b.t)).slice(0,30);
    h+=`<div class="sfw" id="stfeat">${sFeat()}</div>
    <div class="shd" id="snew">New &amp; updated</div><div class="sgrid">${its.slice(0,6).map(sCard).join("")}</div>
    ${tg.length?`<div class="shd" id="stags">Browse by tag</div><div class="stagrow">${tg.map(o=>`<span class="schip" data-sa="tag" data-t="${esc(o.t)}">${esc(o.t)}<small>${o.n}</small></span>`).join("")}</div>`:""}
    <div class="shd">All games <small>${its.length}</small></div>${its.slice().sort((a,b)=>a.name.localeCompare(b.name,undefined,{sensitivity:"base"})).map(sRow).join("")}`}
  S.innerHTML=h;S.scrollTop=top;
  if(foc){const n=S.querySelector("#sq");n.focus();n.setSelectionRange(pos,pos)}
  clearInterval(store.timer);
  if(c&&its.length&&!sel&&!filt&&store.feat.length>1)store.timer=setInterval(()=>{const e=$("#stfeat");if(view!=="store"||store.sel||document.hidden||!e)return;store.slide++;e.innerHTML=sFeat()},7000)}
async function storeInstall(key){
  const it=store.items.find(x=>x.key===key);if(!it||store.work[key])return;
  if(!root){store.msg="Select your htmls folder first (Settings > Folders), then press Install again.";renderStore();return}
  if(!net){store.msg="You're offline.";renderStore();return}
  store.work[key]=1;store.msg="";renderStore();
  try{await installRemoteProfile({kind:"new",key,stamp:it.stamp,name:it.name,file:it.file});
    upd.items=upd.items.filter(y=>!(y.key===key&&y.kind!=="launcher"));renderBell();store.msg="__ok"}
  catch(e){store.msg=e&&e.message?e.message:String(e)}
  delete store.work[key];renderStore()}
$("#store").addEventListener("click",e=>{
  const a=e.target.closest("[data-sa]");if(!a)return;e.stopPropagation();const k=a.dataset.k,S=$("#store"),act=a.dataset.sa;
  const feat=()=>{const f=$("#stfeat");if(f)f.innerHTML=sFeat()};
  if(act==="inst")storeInstall(k);
  else if(act==="play"){const g=findGame(k);if(g)launch(g)}
  else if(act==="open"){store.sel=k;store.shot=0;store.msg="";renderStore();S.scrollTop=0;navTrack()}
  else if(act==="back"||act==="home"){store.sel="";store.q="";store.tag="";store.msg="";renderStore();S.scrollTop=0;navTrack()}
  else if(act==="prev"){e.stopPropagation();store.slide=(store.slide+store.feat.length-1)%store.feat.length;feat()}
  else if(act==="next"){store.slide=(store.slide+1)%store.feat.length;feat()}
  else if(act==="dot"){store.slide=+a.dataset.i;feat()}
  else if(act==="shot"){store.shot=+a.dataset.i;const it=store.items.find(x=>x.key===store.sel);if(it){const m=$("#store .smain"),u=sImg(((it.m||{}).screens||[])[store.shot]);if(m&&u)m.style.backgroundImage=`url('${u}')`;$("#store").querySelectorAll(".sthumbs i").forEach((x,i)=>x.classList.toggle("on",i===store.shot))}}
  else if(act==="tag"){store.tag=store.tag.toLowerCase()===a.dataset.t.toLowerCase()?"":a.dataset.t;store.sel="";renderStore();S.scrollTop=0;navTrack()}
  else if(act==="clear"){store.tag="";store.q="";renderStore()}
  else if(act==="refresh")loadStore(true);
  else if(act==="settings")setView("settings");
  else if(act==="goto"){if(store.sel||store.q||store.tag){store.sel="";store.q="";store.tag="";renderStore()}const t=document.getElementById(a.dataset.t);if(t)t.scrollIntoView({behavior:"smooth",block:"start"})}});
$("#store").addEventListener("input",e=>{if(e.target.id==="sq"){store.q=e.target.value;store.sel="";renderStore()}});

dlLoad();dlLog("Volt started - "+(VKEYS().length)+" Drive key(s) configured");
restore();
</script>
</body>
